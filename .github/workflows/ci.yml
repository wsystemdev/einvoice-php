name: CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {php: ['8.1', '8.2', '8.3', '8.4']}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', extensions: 'dom, libxml, mbstring, zlib', coverage: none}
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
  official-validators:
    # Every fixture the PHP generator produces is checked by independent official tools:
    # KoSIT validator (XRechnung 3.0.2 config bundled in this repo), veraPDF (PDF/A-3b) and Mustang (ZUGFeRD/Factur-X).
    # Verdicts must equal the W System engine's (tests/fixtures/expected.json).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', extensions: 'dom, libxml, mbstring, zlib', coverage: none}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: composer install --no-interaction --no-progress
      - name: Download pinned validators
        run: |
          mkdir -p /tmp/tools
          curl -sfL -o /tmp/tools/kosit.jar https://github.com/itplr-kosit/validator/releases/download/v1.6.3/validator-1.6.3-standalone.jar
          curl -sfL -o /tmp/tools/mustang.jar https://github.com/ZUGFeRD/mustangproject/releases/download/core-2.26.0/Mustang-CLI-2.26.0.jar
          echo "799e64befca97d4080e03608c80b85dd5a5ecc5f4ae4f35d1116ec2855b9a7c9  /tmp/tools/kosit.jar" | sha256sum -c
          echo "42d7868cb68264874a7b8cab4c3587b03b23ccc7cd72373da917f66758bb9736  /tmp/tools/mustang.jar" | sha256sum -c
          docker pull -q verapdf/cli:v1.30.4
      - run: php tools/ci/generate.php build/official
      - name: KoSIT validator on every XRechnung file
        run: tools/ci/kosit-check.sh build/official /tmp/tools/kosit.jar
      - name: veraPDF PDF/A-3b on every PDF
        run: |
          n=$(ls build/official/*.pdf | wc -l)
          docker run --rm -v "$PWD/build/official:/data" verapdf/cli:v1.30.4 --flavour 3b --format text /data > /tmp/vera.txt || true
          pass=$(grep -c '^PASS ' /tmp/vera.txt || true)
          echo "veraPDF: $pass / $n PASS"; grep -v '^PASS ' /tmp/vera.txt | head -20
          test "$pass" -eq "$n"
      - name: Mustang on every valid PDF
        run: tools/ci/mustang-check.sh build/official /tmp/tools/mustang.jar
  saxonc:
    # Validator stream: the official KoSIT/CEN rules through the SaxonC-HE 13.1.1 PHP extension (built from Saxonica's
    # pinned zip). WSYSTEM_REQUIRE_SAXONC=1 turns "extension missing" into a failure instead of a skip, so the SaxonC
    # parity tests (identical results to the W System engine) and the php-core-vs-SaxonC checks really run.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {php: ['8.1', '8.2', '8.3', '8.4']}
    env:
      SAXONC_ZIP: https://downloads.saxonica.com/SaxonC/HE/13/SaxonCHE-linux-x86_64-13-1-1.zip
      SAXONC_SHA256: 66bdeba467fcfa0be1f78c7ae477524773a5e39821a159884a7fd1aab6301d16
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', extensions: 'dom, libxml, mbstring, zlib', coverage: none, tools: phpize}
      - name: Build SaxonC-HE and its PHP extension
        run: |
          curl -sfL -o /tmp/saxonc.zip "$SAXONC_ZIP"
          echo "$SAXONC_SHA256  /tmp/saxonc.zip" | sha256sum -c
          sudo mkdir -p /opt/saxonica && sudo unzip -q /tmp/saxonc.zip -d /opt/saxonica && sudo chown -R "$USER" /opt/saxonica
          S=/opt/saxonica/SaxonCHE-linux-x86_64-13-1-1
          (cd $S/src && mkdir -p build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Release >/dev/null && make -j4 >/dev/null && mkdir -p $S/SaxonCHE/lib && cp -P libsaxonc-he.so* $S/SaxonCHE/lib/)
          (cd $S/php/src && phpize >/dev/null && ./configure --with-saxonc=$S/SaxonCHE --with-saxonc-core=$S/SaxonCCoreHE >/dev/null && make -j4 >/dev/null)
          echo "LD_LIBRARY_PATH=$S/SaxonCCoreHE/lib:$S/SaxonCHE/lib" >> "$GITHUB_ENV"
          echo "SAXON_EXT=$S/php/src/modules/saxon.so" >> "$GITHUB_ENV"
      - run: composer install --no-interaction --no-progress
      - run: php -d extension=$SAXON_EXT -r 'echo (new Saxon\SaxonProcessor(false))->version(), PHP_EOL;'
      - run: WSYSTEM_REQUIRE_SAXONC=1 php -d extension=$SAXON_EXT -d memory_limit=2G vendor/bin/phpunit tests/Validator
      - name: php-core vs SaxonC on the corpus plus seeded mutations
        run: php -d extension=$SAXON_EXT -d memory_limit=3G tools/validator/differential.php --mutants=3 --seed=1 --out=/tmp/differential.json
